# Optional static sample for inspecting Pod PriorityClass references.
# Use scripts/run-experiment-2.ps1 for capacity-calibrated preemption on both workers.
apiVersion: v1
kind: Pod
metadata:
  name: preemptor-high-pod
  namespace: priority-scheduling
  labels:
    experiment: manual-priority-sample
    role: preemptor
    tier: high
spec:
  priorityClassName: high-priority
  restartPolicy: Never
  containers:
  - name: critical-worker
    image: busybox:1.36
    command: ["sh", "-c", "echo 'High-priority preemptor running'; sleep 7200"]
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
