# Experiment 1: Multi-Tier Microservice Priority Scheduling (12 Workload Pods)
# -----------------------------------------------------------------------------
# Tier 1: High Priority (100,000) - Mission Critical Core Services
apiVersion: v1
kind: Pod
metadata:
  name: auth-service-core
  namespace: priority-scheduling
  labels:
    experiment: experiment-1
    service: auth
    tier: high
spec:
  priorityClassName: high-priority
  restartPolicy: Never
  containers:
  - name: service
    image: busybox:1.36
    command: ["sh", "-c", "echo '[CORE] Auth Service Online'; sleep 7200"]
    resources:
      requests:
        cpu: "300m"
        memory: "128Mi"
      limits:
        cpu: "600m"
        memory: "256Mi"
---
