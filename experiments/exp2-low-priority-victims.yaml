apiVersion: v1
kind: Pod
metadata:
  name: victim-low-pod-1
  namespace: priority-scheduling
  labels:
    experiment: experiment-2
    role: victim
    tier: low
spec:
  priorityClassName: low-priority
  restartPolicy: Never
  containers:
  - name: victim-worker
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Victim Pod 1 running'; sleep 7200"]
    resources:
      requests:
        cpu: "3074m"
        memory: "256Mi"
      limits:
        cpu: "3688m"
        memory: "512Mi"
