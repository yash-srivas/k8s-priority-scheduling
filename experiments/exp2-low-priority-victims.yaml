# Optional static sample for inspecting Pod PriorityClass references.
# Use scripts/run-experiment-2.ps1 for capacity-calibrated preemption on both workers.
apiVersion: v1
kind: Pod
metadata:
  name: victim-low-pod-1
  namespace: priority-scheduling
  labels:
    experiment: manual-priority-sample
    role: victim
    tier: low
spec:
  priorityClassName: low-priority
  restartPolicy: Never
  containers:
  - name: victim-worker
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Victim Pod 1 running'; sleep 7200"]
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
---
