apiVersion: v1
kind: Pod
metadata:
  name: high-priority-core-1
  namespace: priority-scheduling
  labels:
    app: mission-critical-core
    tier: critical
    priority-tier: high
spec:
  priorityClassName: high-priority
  restartPolicy: Never
  containers:
  - name: core
    image: busybox:1.36
    command: ["sh", "-c", "echo 'High-priority core service active'; sleep 7200"]
    resources:
      requests:
        cpu: "300m"
        memory: "128Mi"
      limits:
        cpu: "600m"
        memory: "256Mi"
