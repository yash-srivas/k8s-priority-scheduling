apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "High-priority class for mission-critical Kubernetes workloads that can preempt lower priority workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium-priority
value: 50000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Medium-priority class for regular production workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: 10000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Low-priority class for batch, background, or non-critical workloads that can be preempted."
