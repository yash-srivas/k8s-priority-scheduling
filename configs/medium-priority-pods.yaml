apiVersion: v1
kind: Pod
metadata:
  name: medium-priority-api-1
  namespace: priority-scheduling
  labels:
    app: standard-api
    tier: service
    priority-tier: medium
spec:
  priorityClassName: medium-priority
  restartPolicy: Never
  containers:
  - name: api
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Medium-priority API service 1 active'; sleep 7200"]
    resources:
      requests:
        cpu: "250m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "128Mi"
